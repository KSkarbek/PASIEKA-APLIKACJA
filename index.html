<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PASIEKA v9.2 - Asystent Pasieki</title>

  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐝</text></svg>">
  <meta name="theme-color" content="#d97706">
  
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <link rel="stylesheet" href="styles.css?v=9.2">
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>

  <header class="app-header">
    <div class="logo-area">
      <span class="bee-icon">🐝</span>
      <div>
        <h1>PASIEKA <span style="font-size:0.75rem; background:#059669; color:#fff; padding:2px 8px; border-radius:6px; vertical-align:middle;">v9.2</span></h1>
        <p class="subtitle">Ewidencja 18 uli • 3 Pasieki</p>
      </div>
    </div>
    <div class="header-actions">
      <div id="sync-status-badge" class="sync-badge synced">🟢 Połączono</div>
      <button id="btn-header-sync" class="btn-small" style="background:#f59e0b; color:white; border:none; padding:6px 12px; font-weight:bold;">🔄 Synchro</button>
    </div>
  </header>

  <nav class="tab-nav">
    <button class="tab-btn active" data-tab="tab-dom">🏡 DOM (1-6)</button>
    <button class="tab-btn" data-tab="tab-zbior">🌾 ZBIÓR (7-12)</button>
    <button class="tab-btn" data-tab="tab-las">🌲 LAS (13-18)</button>
    <button class="tab-btn" data-tab="tab-todo" style="background:#059669; color:#fff; font-weight:bold;">📋 ZROBIĆ / ZROBIONE</button>
    <button class="tab-btn" data-tab="tab-sheet">📊 Arkusz / Ustawienia</button>
  </nav>

  <section id="tab-dom" class="tab-content active">
    <div class="section-title title-dom"><h2>🏡 Pasieka DOM</h2><span class="badge-count group-dom">Ule 1 – 6</span></div>
    <div id="hives-grid-dom" class="hives-grid hives-grid-dom"></div>
  </section>
  
  <section id="tab-zbior" class="tab-content">
    <div class="section-title title-zbior"><h2>🌾 Pasieka ZBIÓR</h2><span class="badge-count group-zbior">Ule 7 – 12</span></div>
    <div id="hives-grid-zbior" class="hives-grid hives-grid-zbior"></div>
  </section>
  
  <section id="tab-las" class="tab-content">
    <div class="section-title title-las"><h2>🌲 Pasieka LAS</h2><span class="badge-count group-las">Ule 13 – 18</span></div>
    <div id="hives-grid-las" class="hives-grid hives-grid-las"></div>
  </section>
  
  <!-- ZAKŁADKA ZROBIĆ / ZROBIONE -->
  <section id="tab-todo" class="tab-content">
    <div class="card form-card" style="margin-bottom: 16px; border: 2px solid #059669;">
      <div class="card-header" style="background: #059669; color: #ffffff; display:flex; justify-content:space-between; align-items:center;">
        <h2 id="todo-form-title" style="margin:0; font-size:1.1rem;">➕ Dodaj Niezależną Notatkę / Zadanie</h2>
        <button type="button" id="btn-cancel-todo-edit" class="btn-small hidden" onclick="resetTodoForm()" style="background:#ffffff; color:#065f46; font-weight:bold;">✖ Anuluj edycję</button>
      </div>

      <form id="todo-form" style="padding-top:10px;">
        <div class="form-group">
          <label class="group-label" style="font-weight:bold; color:#065f46; margin-bottom:6px; display:block;">Czego dotyczy notatka?</label>
          <div class="radio-group" style="display:flex; gap:10px; flex-wrap:wrap; margin-bottom:10px;">
            <label style="flex:1; min-width:180px; background:#ecfdf5; border:2px solid #059669; padding:8px 12px; border-radius:8px; font-weight:bold; cursor:pointer; display:flex; align-items:center; gap:6px;">
              <input type="radio" name="todoScopeType" value="PASIEKA" checked onchange="toggleTodoScopeSelect()"> 🐝 Całej pasieki
            </label>
            <label style="flex:1; min-width:180px; background:#fef3c7; border:2px solid #d97706; padding:8px 12px; border-radius:8px; font-weight:bold; cursor:pointer; display:flex; align-items:center; gap:6px;">
              <input type="radio" name="todoScopeType" value="UL" onchange="toggleTodoScopeSelect()"> 🏠 Konkretnego ula (1-18)
            </label>
          </div>
        </div>

        <div class="form-row flex-row align-center" style="display:flex; gap:12px; flex-wrap:wrap;">
          <div id="todo-scope-pasieka-box" class="form-group flex-1" style="min-width:200px;">
            <label for="select-todo-pasieka">Wybierz pasiekę:</label>
            <select id="select-todo-pasieka" class="input-control select-lg">
              <option value="CAŁA PASIEKA" selected>🐝 Cała Pasieka (Wszystkie ule 1-18)</option>
              <option value="PASIEKA DOM">🏡 Pasieka DOM (Ule 1-6)</option>
              <option value="PASIEKA ZBIÓR">🌾 Pasieka ZBIÓR (Ule 7-12)</option>
              <option value="PASIEKA LAS">🌲 Pasieka LAS (Ule 13-18)</option>
            </select>
          </div>

          <div id="todo-scope-hive-box" class="form-group flex-1 hidden" style="min-width:200px;">
            <label for="select-todo-hive">Wybierz numer ula:</label>
            <select id="select-todo-hive" class="input-control select-lg">
              <option value="1">Ul 1 (DOM)</option>
              <option value="2">Ul 2 (DOM)</option>
              <option value="3">Ul 3 (DOM)</option>
              <option value="4">Ul 4 (DOM)</option>
              <option value="5">Ul 5 (DOM)</option>
              <option value="6">Ul 6 (DOM)</option>
              <option value="7">Ul 7 (ZBIÓR)</option>
              <option value="8">Ul 8 (ZBIÓR)</option>
              <option value="9">Ul 9 (ZBIÓR)</option>
              <option value="10">Ul 10 (ZBIÓR)</option>
              <option value="11">Ul 11 (ZBIÓR)</option>
              <option value="12">Ul 12 (ZBIÓR)</option>
              <option value="13">Ul 13 (LAS)</option>
              <option value="14">Ul 14 (LAS)</option>
              <option value="15">Ul 15 (LAS)</option>
              <option value="16">Ul 16 (LAS)</option>
              <option value="17">Ul 17 (LAS)</option>
              <option value="18">Ul 18 (LAS)</option>
            </select>
          </div>

          <div class="form-group date-compact-group" style="min-width:200px;">
            <label for="input-todo-date">Data / Termin:</label>
            <input type="datetime-local" id="input-todo-date" class="input-control compact-date-input" required>
          </div>
        </div>

        <div class="form-group margin-top-md">
          <label for="input-todo-text">Treść notatki lub zadania:</label>
          <textarea id="input-todo-text" class="input-control" rows="2" placeholder="np. Kupić 50 kg cukru, przygotować ramki, sprawdzić matkę..." required></textarea>
        </div>

        <div class="form-group margin-top-md">
          <label class="group-label">Status początkowy notatki:</label>
          <div class="radio-group" style="display:flex; gap:10px; flex-wrap:wrap;">
            <label style="cursor:pointer;"><input type="radio" name="todoInitStatus" value="TODO" checked> ⏳ Do zrobienia (Niewykonane)</label>
            <label style="cursor:pointer;"><input type="radio" name="todoInitStatus" value="DONE"> ✅ Od razu jako Wykonane (Zrobione)</label>
          </div>
        </div>

        <div class="form-actions margin-top-md">
          <button type="submit" id="btn-submit-todo" class="btn-primary" style="background:#059669; border-color:#047857; font-size:1.05rem; width:100%; padding:12px;">
            💾 ZAPISZ NOTATKĘ I SYNCHRONIZUJ
          </button>
        </div>
      </form>
    </div>

    <!-- Pasek szybkiego przełączania zakładek wewnątrz ZROBIĆ / ZROBIONE -->
    <div style="display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap;">
      <button type="button" id="subtab-btn-all" onclick="switchTodoSubtab('ALL')" class="btn-small" style="flex:1; padding:10px; font-weight:bold; background:#059669; color:white; border:2px solid #047857;">
        📋 Wszystkie (<span id="count-todo-all">0</span>)
      </button>
      <button type="button" id="subtab-btn-pending" onclick="switchTodoSubtab('PENDING')" class="btn-small" style="flex:1; padding:10px; font-weight:bold; background:#fef3c7; color:#92400e; border:2px solid #f59e0b;">
        ⏳ Do Zrobienia (<span id="count-todo-pending">0</span>)
      </button>
      <button type="button" id="subtab-btn-done" onclick="switchTodoSubtab('DONE')" class="btn-small" style="flex:1; padding:10px; font-weight:bold; background:#d1fae5; color:#065f46; border:2px solid #10b981;">
        ✅ Zakładka „Zrobione” (<span id="count-todo-done">0</span>)
      </button>
